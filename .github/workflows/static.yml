# Manual, gated deployment of the explicit Preparation Station release artifact.
# Pages is configured to serve from: main branch → /release folder.
# This workflow builds the vetted artifact and commits it to release/ on main.
name: Deploy vetted Pages release

on:
  workflow_dispatch:

permissions:
  contents: write   # needs write to commit release/ back to main

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and commit release artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the selected main commit
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate canonical project and catalog state
        run: python3 tools/validate_project_state.py

      - name: Rebuild generated pages
        run: python3 build.py

      - name: Confirm generated pages are committed
        shell: bash
        run: |
          generated_pages=(
            index.html
            store/shop.html
            store/product.html
            store/order.html
            general-store/shop.html
            general-store/product.html
            general-store/checkout.html
          )
          changes="$(git status --porcelain --untracked-files=all -- "${generated_pages[@]}")"
          if [[ -n "$changes" ]]; then
            echo "Generated storefront pages are not up to date:"
            echo "$changes"
            exit 1
          fi

      - name: Enforce release-readiness gates and build artifact
        run: >-
          python3 tools/build_pages_release.py
          --output release
          --require-ready

      - name: Smoke-test artifact boundaries
        run: >-
          python3 tools/test_pages_release.py
          release

      - name: Commit release/ folder to main
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add release/
          if git diff --cached --quiet; then
            echo "release/ is already up to date — no commit needed."
          else
            git commit -m "chore(release): update Pages artifact [skip ci]"
            git push origin main
          fi
