name: Build storefront

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Rebuild generated storefront pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run static-site build
        run: python3 build.py

      - name: Confirm generated pages are committed
        shell: bash
        run: |
          generated_pages=(
            index.html
            store/shop.html
            store/product.html
            store/order.html
            general-store/shop.html
            general-store/product.html
            general-store/checkout.html
          )
          changes="$(git status --porcelain --untracked-files=all -- "${generated_pages[@]}")"
          if [[ -n "$changes" ]]; then
            echo "Generated storefront pages are not up to date:"
            echo "$changes"
            exit 1
          fi
