name: Restore truncated cart.js
on:
  push:
    branches:
      - agent/catalog-hs503-odyssey-links
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/catalog-hs503-odyssey-links
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore cart.js and apply public catalog fixes
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- store/cart.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('store/cart.js')
          t = p.read_text()
          t = t.replace("'Core Subjects Workbook Set'", "'Weekly Evidence Binder'")
          p.write_text(t)
          print('cart.js bytes', p.stat().st_size)
          PY
          python3 tools/pr73_apply_public_catalog.py
          python3 build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/cart.js catalog.html tools/validate_project_state.py src/page.html src/info/tefa.html src/info/contact.html src/info/shop-by-age.html products/PS-HS-501.html store/src/shop.html PRICING.md index.html tefa.html contact.html shop-by-age.html
          if git diff --cached --quiet; then
            echo "no further changes"
            exit 0
          fi
          git commit -m "Apply catalog HS-503 drop, HS-501 rename, Odyssey links, restore cart.js"
          git push origin agent/catalog-hs503-odyssey-links
