name: Restore truncated cart.js
on:
  push:
    branches:
      - agent/catalog-hs503-odyssey-links
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/catalog-hs503-odyssey-links
      - name: Restore store/cart.js from main
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- store/cart.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('store/cart.js')
          t = p.read_text()
          t = t.replace("'Core Subjects Workbook Set'", "'Weekly Evidence Binder'")
          p.write_text(t)
          print('restored', p.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add store/cart.js
          if git diff --cached --quiet; then
            echo "cart.js already matches restored content"
            exit 0
          fi
          git commit -m "Restore complete store/cart.js from main (HS-501 rename only)"
          git push origin agent/catalog-hs503-odyssey-links
