name: OmniRoute routing task
about: Request routing, dashboard, or model-assignment integration work.
title: "OmniRoute: "
labels: [omniroute]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should OmniRoute route, display, or automate?
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options:
        - Code
        - Documentation
        - Audit
        - Research
        - Dashboard
        - Operations
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
  - type: textarea
    id: integration_target
    attributes:
      label: Integration target
      description: Provide the OmniRoute repo, dashboard repo, API endpoint, schema, or architecture note. Real routing cannot be wired without one.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know this route works?
    validations:
      required: true
